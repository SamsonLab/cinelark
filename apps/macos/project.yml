name: CineLark
options:
  createIntermediateGroups: true
  developmentLanguage: en
  fileTypes:
    icon:
      file: true
  deploymentTarget:
    macOS: "26.0"
packages:
  CineLarkKit:
    path: ../../packages/apple/CineLarkKit
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 8.11.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.2
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: true
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4B8LRMN347
    MARKETING_VERSION: 0.1.7
    CURRENT_PROJECT_VERSION: 8
targets:
  CineLark:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: CineLark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: Copyright © 2026 SamsonLab
        SUFeedURL: https://github.com/SamsonLab/cinelark/releases/latest/download/appcast.xml
        SUPublicEDKey: HcV9Bm5OCtcIwB2tvhEq5J1UPzgcgb6ZTxF0lQCUPTU=
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
    preBuildScripts:
      - name: Build Playback Bridge
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"

          ROOT="$SRCROOT/../.."
          CRATE="$ROOT/packages/rust/cinelark-bridge/Cargo.toml"
          TARGET_DIR="$DERIVED_FILE_DIR/cinelark-bridge"
          HELPER_DIR="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          RESOURCE_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$HELPER_DIR" "$RESOURCE_DIR" "$TARGET_DIR"

          PROFILE_ARG=""
          PROFILE_DIR="debug"
          if [[ "$CONFIGURATION" == "Release" ]]; then
            PROFILE_ARG="--release"
            PROFILE_DIR="release"
          fi

          BINARIES=()
          for ARCH in ${ARCHS:-$(uname -m)}; do
            case "$ARCH" in
              arm64) RUST_TARGET="aarch64-apple-darwin" ;;
              x86_64) RUST_TARGET="x86_64-apple-darwin" ;;
              *) echo "Unsupported bridge architecture: $ARCH" >&2; exit 1 ;;
            esac
            cargo +1.95.0 build --locked --manifest-path "$CRATE" --target-dir "$TARGET_DIR" --target "$RUST_TARGET" $PROFILE_ARG
            BINARIES+=("$TARGET_DIR/$RUST_TARGET/$PROFILE_DIR/cinelark-bridge")
          done

          if [[ ${#BINARIES[@]} -eq 1 ]]; then
            cp "${BINARIES[0]}" "$HELPER_DIR/CineLarkBridge"
          else
            /usr/bin/lipo -create "${BINARIES[@]}" -output "$HELPER_DIR/CineLarkBridge"
          fi
          chmod 755 "$HELPER_DIR/CineLarkBridge"

          rm -f "$RESOURCE_DIR/CineLark.iinaplgz"
          (cd "$ROOT/plugins/iina" && /usr/bin/zip -q -r "$RESOURCE_DIR/CineLark.iinaplgz" Info.json src)

          if [[ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" && -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" && "${EXPANDED_CODE_SIGN_IDENTITY}" != "-" ]]; then
            /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp=none "$HELPER_DIR/CineLarkBridge"
          fi
    dependencies:
      - package: CineLarkKit
        product: CineLarkDomain
      - package: CineLarkKit
        product: CineLarkUHDNow
      - package: CineLarkKit
        product: CineLarkPersistence
      - package: CineLarkKit
        product: CineLarkPlayback
      - package: Kingfisher
        product: Kingfisher
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samsonlab.cinelark
        PRODUCT_NAME: CineLark
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
    scheme:
      gatherCoverageData: true
