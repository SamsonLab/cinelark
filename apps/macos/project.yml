name: CineLark
options:
  createIntermediateGroups: true
  developmentLanguage: en
  fileTypes:
    icon:
      file: true
  deploymentTarget:
    macOS: "26.0"
packages:
  CineLarkKit:
    path: ../../packages/apple/CineLarkKit
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 8.11.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.9.2
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture.git
    exactVersion: 1.26.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: true
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4B8LRMN347
    MARKETING_VERSION: 0.1.11
    CURRENT_PROJECT_VERSION: 12
targets:
  CineLark:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: CineLark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        NSPrincipalClass: NSApplication
        NSLocalNetworkUsageDescription: CineLark uses your local network to connect to your paired phone remote.
        NSBonjourServices:
          - _cinelark._tcp
        NSHumanReadableCopyright: Copyright © 2026 SamsonLab
        SUFeedURL: https://github.com/SamsonLab/cinelark/releases/latest/download/appcast.xml
        SUPublicEDKey: HcV9Bm5OCtcIwB2tvhEq5J1UPzgcgb6ZTxF0lQCUPTU=
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
    preBuildScripts:
      - name: Build Native Helpers
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"

          ROOT="$SRCROOT/../.."
          HELPER_DIR="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          RESOURCE_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$HELPER_DIR" "$RESOURCE_DIR"
          rm -f "$HELPER_DIR/CineLarkBridge" "$HELPER_DIR/CineLarkRemoteGateway"

          PROFILE_ARG=""
          PROFILE_DIR="debug"
          if [[ "$CONFIGURATION" == "Release" ]]; then
            PROFILE_ARG="--release"
            PROFILE_DIR="release"
          fi

          build_helper() {
            local crate_name="$1"
            local binary_name="$2"
            local bundle_name="$3"
            local target_dir="$DERIVED_FILE_DIR/$crate_name"
            local crate="$ROOT/packages/rust/$crate_name/Cargo.toml"
            local binaries=()
            mkdir -p "$target_dir"
            for arch in ${ARCHS:-$(uname -m)}; do
              case "$arch" in
                arm64) rust_target="aarch64-apple-darwin" ;;
                x86_64) rust_target="x86_64-apple-darwin" ;;
                *) echo "Unsupported helper architecture: $arch" >&2; exit 1 ;;
              esac
              cargo +1.95.0 build --locked --manifest-path "$crate" --target-dir "$target_dir" --target "$rust_target" $PROFILE_ARG
              binaries+=("$target_dir/$rust_target/$PROFILE_DIR/$binary_name")
            done
            if [[ ${#binaries[@]} -eq 1 ]]; then
              cp "${binaries[0]}" "$HELPER_DIR/$bundle_name"
            else
              /usr/bin/lipo -create "${binaries[@]}" -output "$HELPER_DIR/$bundle_name"
            fi
            if [[ "$CONFIGURATION" == "Release" ]]; then
              /usr/bin/strip -x "$HELPER_DIR/$bundle_name"
            fi
            chmod 755 "$HELPER_DIR/$bundle_name"
          }

          build_helper "cinelark-gateway" "cinelark-gateway" "CineLarkGateway"

          rm -f "$RESOURCE_DIR/CineLark.iinaplgz"
          (cd "$ROOT/plugins/iina" && /usr/bin/zip -q -r "$RESOURCE_DIR/CineLark.iinaplgz" Info.json src)
          rm -rf "$RESOURCE_DIR/CineLark.iinaplugin"
          mkdir -p "$RESOURCE_DIR/CineLark.iinaplugin"
          /usr/bin/ditto "$ROOT/plugins/iina/Info.json" "$RESOURCE_DIR/CineLark.iinaplugin/Info.json"
          /usr/bin/ditto "$ROOT/plugins/iina/src" "$RESOURCE_DIR/CineLark.iinaplugin/src"

          if [[ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" && -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" && "${EXPANDED_CODE_SIGN_IDENTITY}" != "-" ]]; then
            /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp=none "$HELPER_DIR/CineLarkGateway"
          fi
    dependencies:
      - package: CineLarkKit
        product: CineLarkDomain
      - package: CineLarkKit
        product: CineLarkPluginAPI
      - package: CineLarkKit
        product: CineLarkCatalog
      - package: CineLarkKit
        product: CineLarkProfile
      - package: CineLarkKit
        product: CineLarkInsights
      - package: CineLarkKit
        product: CineLarkEmby
      - package: CineLarkKit
        product: CineLarkPersistence
      - package: CineLarkKit
        product: CineLarkPlayback
      - package: CineLarkKit
        product: CineLarkRemote
      - package: CineLarkKit
        product: CineLarkGateway
      - package: Kingfisher
        product: Kingfisher
      - package: Sparkle
        product: Sparkle
      - package: ComposableArchitecture
        product: ComposableArchitecture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samsonlab.cinelark
        PRODUCT_NAME: CineLark
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: CineLark.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
    scheme:
      gatherCoverageData: true
      testTargets:
        - CineLarkTests
  CineLarkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: CineLark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samsonlab.cinelark.tests
        GENERATE_INFOPLIST_FILE: true
