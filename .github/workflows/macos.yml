name: macOS

on:
  push:
    branches: [main]
    paths:
      - "apps/macos/**"
      - "packages/apple/**"
      - "packages/rust/cinelark-gateway/**"
      - "plugins/iina/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "apps/macos/**"
      - "packages/apple/**"
      - "packages/rust/cinelark-gateway/**"
      - "plugins/iina/**"
      - ".github/workflows/macos.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test Swift packages
        run: swift test --package-path packages/apple/CineLarkKit
      - name: Build CineLark
        run: >-
          xcodebuild
          -project apps/macos/CineLark.xcodeproj
          -scheme CineLark
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build
