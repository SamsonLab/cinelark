name: Release Validation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(awk '/MARKETING_VERSION:/ { print $2; exit }' apps/macos/project.yml)
          BUILD_VERSION=$(awk '/CURRENT_PROJECT_VERSION:/ { print $2; exit }' apps/macos/project.yml)
          if [[ "$GITHUB_REF_NAME" != v* || "$VERSION" != "$PROJECT_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $PROJECT_VERSION"
            exit 1
          fi
          if [[ ! "$BUILD_VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::CURRENT_PROJECT_VERSION must be a positive integer"
            exit 1
          fi

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.95.0
          --profile minimal
          --target aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test release inputs
        run: |
          swift test --package-path packages/apple/CineLarkKit
          npm test --prefix plugins/iina
          python3 scripts/check_repository.py

      - name: Build unsigned universal app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project apps/macos/CineLark.xcodeproj \
            -scheme CineLark \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipMacroValidation \
            'ARCHS=arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Confirm local publication boundary
        run: >-
          echo "Release signing, Sparkle feed generation, publication, and
          Homebrew Cask updates are performed by scripts/prepare_macos_release.sh
          and scripts/publish_macos_release.sh on the maintainer Mac."
